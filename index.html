  --bg:#0F1713; --surface:#16211B; --fg:#E5EEE8; --muted:#9BAAA1; --line:#2A3A31;

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;

main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

h2{font-size:17px;font-weight:700}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brand{font-size:13px;color:var(--accent);font-weight:500;letter-spacing:.02em}
.langs{display:flex;gap:4px}
.langs button{min-height:36px;min-width:44px;padding:0 8px;font-size:13px}
.langs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:500}
.sub{color:var(--muted);font-size:14px}
.why{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.45}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 140px;min-width:0}
label{font-size:13px;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:0 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:500}
button.ghost{background:transparent}
.pl{display:flex;gap:8px;flex-wrap:wrap}
.pl button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:500}
.seg{display:flex}
.seg button{flex:1;border-radius:0}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:500}
.item{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.item .t{font-weight:500}
.item .h{font-size:13px;color:var(--muted)}
.ctrs{display:flex;gap:8px 16px;flex-wrap:wrap}
.ctr{display:flex;align-items:center;gap:6px}
.ctr .lab{font-size:13px;color:var(--muted);min-width:56px}
.ctr button{min-width:44px;padding:0;font-size:20px;line-height:1}
.ctr .n{min-width:28px;text-align:center;font-weight:500;font-variant-numeric:tabular-nums}
.err{color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:16px}
.games{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:999px;padding:4px 4px 4px 12px;font-size:14px}
.chip button{min-height:32px;min-width:32px;border-radius:999px;padding:0;border:0;background:transparent;color:var(--muted)}
.bar{display:flex;flex-direction:column;gap:4px}
.bar .top2{display:flex;justify-content:space-between;gap:8px;font-size:14px;flex-wrap:wrap}
.bar .val{color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--accent)}
.fill.low{background:var(--warn)}
.note{font-size:13px;color:var(--muted)}
.verdict{background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.verdict.wait{background:var(--warn-soft)}
.verdict strong{font-family:var(--font-head);font-weight:700}
.feedback{background:var(--accent-soft);border:1px dashed var(--accent);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.feedback p{font-size:14px}
.feedback a{font-weight:500}
ul{margin:0;padding-left:18px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td input{width:68px;min-height:36px;padding:4px 6px}
footer{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px}

<main>
  <header style="display:flex;flex-direction:column;gap:8px">
    <div class="top">
      <p class="brand" data-i18n="brand"></p>
      <div class="langs" id="langs" role="group" aria-label="Language"></div>
    </div>
    <h1 data-i18n="h1"></h1>
    <p class="sub" data-i18n="sub"></p>
    <div class="why" data-i18n="why"></div>
  </header>

  <section class="card" aria-labelledby="h-players">
    <h2 id="h-players" data-i18n="h_players"></h2>
    <div class="pl" id="players"></div>
    <div class="row">
      <div class="field"><label for="pname" data-i18n="l_pname"></label><input type="text" id="pname" data-i18n-ph="ph_pname" autocomplete="off"></div>
      <div class="field"><label for="pbirth" data-i18n="l_pbirth"></label><input type="date" id="pbirth"></div>
    </div>
    <div class="err" id="perr" role="alert" hidden></div>
    <div class="actions">
      <button class="primary" id="addp" data-i18n="add_player"></button>
      <button class="ghost" id="delp" data-i18n="del_player" hidden></button>
    </div>
    <p class="note" id="agenote"></p>
  </section>

  <section class="card" aria-labelledby="h-game">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
      <h2 id="h-game"></h2>
      <span class="note"><span data-i18n="observing"></span> <strong id="who"></strong></span>
    </div>
    <div class="seg" role="group" data-i18n-aria="mode_aria">
      <button id="m-live" aria-pressed="true" data-i18n="m_live"></button>
      <button id="m-video" aria-pressed="false" data-i18n="m_video"></button>
    </div>
    <p class="note" id="modenote"></p>
    <div class="row">
      <div class="field"><label for="mins" data-i18n="l_mins"></label><input type="number" id="mins" min="5" max="90" value="16" inputmode="numeric"></div>
      <div class="field"><label for="fmt" data-i18n="l_fmt"></label><select id="fmt"></select></div>
      <div class="field"><label for="pos" data-i18n="l_pos"></label><select id="pos"></select></div>
      <div class="field"><label for="opp" data-i18n="l_opp"></label><select id="opp"></select></div>
    </div>
    <div id="items"></div>
    <div class="err" id="err" role="alert" hidden></div>
    <div class="actions">
      <button class="primary" id="save" data-i18n="save_one"></button>
      <button id="saveall" data-i18n="save_all"></button>
      <button class="ghost" id="clearform" data-i18n="clear_c"></button>
    </div>
  </section>

  <section class="card" aria-labelledby="h-res">
    <h2 id="h-res" data-i18n="h_res"></h2>
    <div id="result"></div>
    <div id="feedback-block" hidden></div>
    <div class="actions">
      <button id="sample" data-i18n="sample_btn"></button>
      <button class="ghost" id="wipe" data-i18n="wipe_btn"></button>
    </div>
  </section>

  <section class="card" aria-labelledby="h-norm">
    <h2 id="h-norm" data-i18n="h_norm"></h2>
    <p class="note" data-i18n="norm_note"></p>
    <div class="tbl" id="norms"></div>
    <div class="actions"><button class="ghost" id="normreset" data-i18n="norm_reset"></button></div>
  </section>

  <footer>
    <p><span data-i18n="foot1"></span> <a href="mailto:trefoilapps@gmail.com">trefoilapps@gmail.com</a></p>
    <p data-i18n="foot2"></p>
    <p data-i18n="foot3"></p>
  </footer>
</main>

var DEF_META={fmt:'f4',pos:'pos_cen',opp:'opp_eq'};
var ALL_KEYS = [], LIVE_KEYS = [];
ITEMS.forEach(function(it){ it.f.forEach(function(p){ ALL_KEYS.push(p[0]); if(it.live) LIVE_KEYS.push(p[0]); }); });

var norms = JSON.parse(JSON.stringify(NORMS_DEF));
var players = [], activeId = null, mode = 'live', draft = {};

function uid(){ return 'p'+Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36); }
function active(){ for(var i=0;i<players.length;i++){ if(players[i].id===activeId) return players[i]; } return null; }
function keysFor(md){ return md==='live'?LIVE_KEYS:ALL_KEYS; }
function zeroC(){ var o={}; ALL_KEYS.forEach(function(k){ o[k]=0; }); return o; }
function newDraft(){ return {c:zeroC(),mins:16,fmt:DEF_META.fmt,pos:DEF_META.pos,opp:DEF_META.opp}; }
function getDraft(id){ if(!draft[id]) draft[id]=newDraft(); return draft[id]; }

function persist(){
  try{ localStorage.setItem(STORE, JSON.stringify({players:players,active:activeId,mode:mode,norms:norms})); }catch(e){}
}
function load(){
  try{
    var raw=localStorage.getItem(STORE);
    if(raw){
      var d=JSON.parse(raw); players=d.players||[]; activeId=d.active||null; mode=d.mode||'live';
      if(d.norms&&d.norms.length===METRICS.length) norms=d.norms;
    } else {
      var o=localStorage.getItem(OLD);
      if(o){
        var q=JSON.parse(o);
        if(q.players){ players=q.players; activeId=q.active||null; mode=q.mode||'live'; if(q.norms) norms=q.norms; }
      }
    }
  }catch(e){}
  // ensure integration fields exist
  players.forEach(function(p){
    if(p.externalId===undefined) p.externalId=null;
    if(p.groupId===undefined) p.groupId=null;
  });
  if(!active()&&players.length) activeId=players[0].id;
}

function ageMonthsOf(b){
  if(!b) return null;
  var d=new Date(b+'T00:00:00'), n=new Date();
  if(isNaN(d.getTime())) return null;
  var m=(n.getFullYear()-d.getFullYear())*12+(n.getMonth()-d.getMonth());
  if(n.getDate()<d.getDate()) m--;
  return m>=0?m:null;
}
function ageYearOf(p){
  var m=p?ageMonthsOf(p.birth):null;
  var y=m===null?9:Math.floor(m/12);
  return Math.min(11,Math.max(7,y));
}
function ageNote(){
  var p=active(), el=$('agenote');
  if(!p){ el.textContent=t('age_add'); return; }
  var m=ageMonthsOf(p.birth);
  if(m===null){ el.textContent=t('age_nob',{n:p.name}); return; }
  var mon=new Date(p.birth+'T00:00:00').getMonth();
  var txt=t('age_txt',{n:p.name,y:Math.floor(m/12),m:m%12});
  if(mon<=2) txt+=t('age_early'); else if(mon>=9) txt+=t('age_late');
  el.textContent=txt;
}

function showErr(id,msg){ var e=$(id); e.textContent=msg; e.hidden=false; }
function hideErr(id){ $(id).hidden=true; }

function buildForm(){
  var host=$('items'); host.textContent='';
  ITEMS.forEach(function(it){
    var d=document.createElement('div'); d.className='item';
    d.dataset.live=it.live?'1':'0';
    var ti=document.createElement('div'); ti.className='t';
    ti.textContent=t('i_'+it.k);
    var h=document.createElement('div'); h.className='h'; h.textContent=t('h_'+it.k);
    var c=document.createElement('div'); c.className='ctrs';
    it.f.forEach(function(pp){
      var lab=t(pp[1]), name=t('i_'+it.k);
      var w=document.createElement('div'); w.className='ctr';
      var l=document.createElement('span'); l.className='lab'; l.textContent=lab;
      var m=document.createElement('button'); m.textContent='−'; m.setAttribute('aria-label',t('minus_aria',{t:name,l:lab})); m.dataset.k=pp[0]; m.dataset.d='-1';
      var n=document.createElement('span'); n.className='n'; n.id='n_'+pp[0]; n.textContent='0';
      var pl=document.createElement('button'); pl.textContent='+'; pl.setAttribute('aria-label',t('plus_aria',{t:name,l:lab})); pl.dataset.k=pp[0]; pl.dataset.d='1';
      w.appendChild(l); w.appendChild(m); w.appendChild(n); w.appendChild(pl); c.appendChild(w);
    });
    d.appendChild(ti); d.appendChild(h); d.appendChild(c); host.appendChild(d);
  });
}
function fillSelect(id,codes,def){
  var s=$(id), cur=s.value||def; s.textContent='';
  codes.forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=t(c); s.appendChild(o); });
  s.value=codes.indexOf(cur)>=0?cur:def;
}

function applyMode(){
  $('m-live').setAttribute('aria-pressed',mode==='live'?'true':'false');
  $('m-video').setAttribute('aria-pressed',mode==='video'?'true':'false');
  var items=$('items').children;
  for(var i=0;i<items.length;i++){ items[i].hidden=(mode==='live'&&items[i].dataset.live==='0'); }
  $('modenote').textContent=t(mode==='live'?'note_live':'note_video');
}

function paintDraft(){
  var p=active();
  var d=p?getDraft(p.id):newDraft();
  ALL_KEYS.forEach(function(k){ var el=$('n_'+k); if(el) el.textContent=d.c[k]; });
  $('mins').value=d.mins;
  [['fmt',FMTS],['pos',POSS],['opp',OPPS]].forEach(function(a){ $(a[0]).value=a[1].indexOf(d[a[0]])>=0?d[a[0]]:DEF_META[a[0]]; });
  $('who').textContent=p?p.name:t('no_player');
  $('h-game').textContent=t('h_game',{n:p?p.games.length+1:1});
}

function renderPlayers(){
  var host=$('players'); host.textContent='';
  if(!players.length){
    var e=document.createElement('div'); e.className='empty'; e.style.width='100%';
    e.textContent=t('no_players'); host.appendChild(e);
  }
  players.forEach(function(p){
    var b=document.createElement('button');
    b.textContent=p.name+' · '+p.games.length+'/'+NEED; b.dataset.pid=p.id;
    b.setAttribute('aria-pressed',p.id===activeId?'true':'false');
    host.appendChild(b);
  });
  $('delp').hidden=!players.length;
  ageNote();
}

function sumK(p,k){ var s=0; p.games.forEach(function(g){ s+=g[k]||0; }); return s; }
function hasKey(g,k){ return !g.rec || g.rec.indexOf(k)>=0; }

function compute(p){
  var ai=ageYearOf(p)-7;
  return METRICS.map(function(m,i){
    var tg=norms[i][ai], name=t(m.nk);
    if(m.kind==='count'){
      var gs=p.games.filter(function(g){ return hasKey(g,m.key); });
      if(!gs.length) return {name:name, pct:null, count:true, text:t('need_video'), note:t('not_live')};
      var mins=0, tot=0; gs.forEach(function(g){ mins+=g.mins||16; tot+=g[m.key]||0; });
      var per=tot/(mins||16)*10;
      return {name:name, pct:Math.min(100,per/tg*100), text:t('per10',{v:Math.round(per*10)/10}), note:t('norm_lbl',{v:tg})};
    }
    var num=sumK(p,m.num), den=sumK(p,m.den);
    if(den<m.min) return {name:name, pct:null, text:t('low_data',{a:num,b:den}), note:t('need_from',{n:m.min})};
    var v=num/den;
    return {name:name, pct:Math.min(100,v/tg*100), text:Math.round(v*100)+'% ('+num+'/'+den+')', note:t('norm_lbl',{v:Math.round(tg*100)+'%'})};
  });
}

function renderFeedback(p){
  var host=$('feedback-block');
  if(!p || p.games.length < 1 || p.games.length > 2){ host.hidden=true; host.textContent=''; return; }
  host.hidden=false;
  host.innerHTML='';
  var box=document.createElement('div'); box.className='feedback';
  var h=document.createElement('strong'); h.textContent=t('fb_title');
  var txt=document.createElement('p'); txt.textContent=t('fb_text');
  var link=document.createElement('a'); link.href='mailto:trefoilapps@gmail.com?subject=Observation form feedback'; link.textContent=t('fb_link');
  box.appendChild(h); box.appendChild(txt); box.appendChild(link);
  host.appendChild(box);
}

function render(){
  var p=active();
  var host=$('result'); host.textContent='';
  host.style.cssText='display:flex;flex-direction:column;gap:14px';
  if(!p || !p.games.length){
    var e=document.createElement('div'); e.className='empty';
    e.textContent=t(!p?'r_noplayer':'r_nogames'); host.appendChild(e);
    renderFeedback(p);
    return;
  }
  var gl=document.createElement('div'); gl.className='games';
  p.games.forEach(function(g,i){
    var c=document.createElement('div'); c.className='chip';
    var s=document.createElement('span');
    s.textContent=t('chip',{n:i+1,m:g.mins||16})+(g.mode==='live'?t('chip_live'):(g.mode==='video'?t('chip_video'):''));
    var x=document.createElement('button'); x.textContent='×'; x.setAttribute('aria-label',t('rm_aria',{n:i+1})); x.dataset.rm=i;
    c.appendChild(s); c.appendChild(x); gl.appendChild(c);
  });
  host.appendChild(gl);

  var res=compute(p), have=res.filter(function(r){ return r.pct!==null; });
  res.forEach(function(r){
    var b=document.createElement('div'); b.className='bar';
    var top=document.createElement('div'); top.className='top2';
    var a=document.createElement('span'); a.textContent=r.name;
    var v=document.createElement('span'); v.className='val'; v.textContent=r.text+' · '+r.note;
    top.appendChild(a); top.appendChild(v); b.appendChild(top);
    var tr=document.createElement('div'); tr.className='track';
    var f=document.createElement('div'); f.className='fill'+(r.pct!==null&&r.pct<50?' low':''); f.style.width=(r.pct===null?0:Math.round(r.pct))+'%';
    tr.appendChild(f); b.appendChild(tr); host.appendChild(b);
  });

  var sorted=have.slice().sort(function(a,b){ return b.pct-a.pct; });
  var ver=document.createElement('div');
  var left=NEED-p.games.length;
  ver.className='verdict'+(left>0?' wait':'');
  var st=document.createElement('strong');
  st.textContent=left>0?t('v_wait',{n:left}):t('v_ok');
  ver.appendChild(st);
  var pp=document.createElement('p');
  pp.textContent=left>0?t('v_wait_p',{n:NEED}):t('v_ok_p',{n:p.games.length});
  ver.appendChild(pp);
  var ul=document.createElement('ul');
  if(sorted.length>=4){
    var s2=sorted.slice(0,2).map(function(r){ return r.name; }).join(', ');
    var g2=sorted.slice(-2).map(function(r){ return r.name; }).reverse().join(', ');
    var l1=document.createElement('li'); l1.textContent=t('v_str',{s:s2});
    var l2=document.createElement('li'); l2.textContent=t('v_gro',{s:g2});
    ul.appendChild(l1); ul.appendChild(l2);
  }
  var pend=res.filter(function(r){ return r.count && r.pct===null; }).map(function(r){ return r.name; });
  if(pend.length){
    var l3=document.createElement('li'); l3.textContent=t('v_pend',{s:pend.join(', ')});
    ul.appendChild(l3);
  }
  if(ul.children.length) ver.appendChild(ul);
  host.appendChild(ver);
  var nt=document.createElement('p'); nt.className='note';
  nt.textContent=t('v_disc',{a:ageYearOf(p)});
  host.appendChild(nt);

  renderFeedback(p);
}

function normShow(m,v){ return m.kind==='rate'?Math.round(v*100):v; }
function buildNorms(){
  var host=$('norms'); host.textContent='';
  var tb=document.createElement('table'), hd=document.createElement('tr');
  [t('th_metric')].concat(AGES.map(function(a){ return t('age_col',{a:a}); })).forEach(function(x){ var th=document.createElement('th'); th.textContent=x; hd.appendChild(th); });
  tb.appendChild(hd);
  METRICS.forEach(function(m,i){
    var tr=document.createElement('tr'), td=document.createElement('td');
    td.textContent=t(m.nk)+(m.kind==='rate'?' (%)':''); tr.appendChild(td);
    AGES.forEach(function(a,j){
      var c=document.createElement('td'), inp=document.createElement('input');
      inp.type='number'; inp.min='0'; inp.step=m.kind==='rate'?'1':'0.5'; if(m.kind==='rate') inp.max='100';
      inp.value=normShow(m,norms[i][j]);
      inp.setAttribute('aria-label',t('norm_aria',{m:t(m.nk),a:a}));
      inp.addEventListener('change',function(){
        var v=parseFloat(inp.value);
        if(!(v>0)){ inp.value=normShow(m,norms[i][j]); return; }
        norms[i][j]=m.kind==='rate'?v/100:v; persist(); render(); track('norm_edited');
      });
      c.appendChild(inp); tr.appendChild(c);
    });
    tb.appendChild(tr);
  });
  host.appendChild(tb);
}

function validate(p){
  var d=getDraft(p.id), c=d.c, ks=keysFor(mode);
  if(!(d.mins>=5&&d.mins<=90)) return t('e_mins');
  if(c.dribOk>c.dribA) return t('e_drib');
  if(c.passOk>c.passAll) return t('e_pok');
  if(c.passFwd>c.passOk) return t('e_pfwd');
  if(c.longOk>c.longA) return t('e_lok');
  if(c.longA>5) return t('e_l5');
  var total=0; ks.forEach(function(k){ total+=c[k]; });
  if(total===0) return t('e_empty');
  return '';
}
function saveGame(p){
  var d=getDraft(p.id), g={}, ks=keysFor(mode);
  ALL_KEYS.forEach(function(k){ g[k]=ks.indexOf(k)>=0?d.c[k]:0; });
  g.rec=ks.slice();
  g.mins=d.mins;
  g.fmt=d.fmt;
  g.pos=d.pos;
  g.opp=d.opp;
  g.mode=mode;
  g.version=1; // for future migration
  p.games.push(g);
  ALL_KEYS.forEach(function(k){ d.c[k]=0; });
  track('game_saved'); if(p.games.length===NEED) track('three_games_done');
}
function draftTotal(p){ var s=0, d=getDraft(p.id); keysFor(mode).forEach(function(k){ s+=d.c[k]; }); return s; }

function langButtons(){
  var host=$('langs'); host.textContent='';
  LANGS.forEach(function(l){
    var b=document.createElement('button'); b.textContent=l[1]; b.dataset.lang=l[0];
    b.setAttribute('aria-pressed',l[0]===lang?'true':'false'); b.setAttribute('lang',l[0]);
    host.appendChild(b);
  });
}
function renderAll(){ renderPlayers(); buildForm(); paintDraft(); applyMode(); render(); }
function applyLang(){
  document.documentElement.lang=lang;
  document.title=t('title');
  var md=document.querySelector('meta[name="description"]'); if(md) md.setAttribute('content',t('desc'));
  var a=document.querySelectorAll('[data-i18n]'); for(var i=0;i<a.length;i++) a[i].textContent=t(a[i].getAttribute('data-i18n'));
  a=document.querySelectorAll('[data-i18n-ph]'); for(i=0;i<a.length;i++) a[i].setAttribute('placeholder',t(a[i].getAttribute('data-i18n-ph')));
  a=document.querySelectorAll('[data-i18n-aria]'); for(i=0;i<a.length;i++) a[i].setAttribute('aria-label',t(a[i].getAttribute('data-i18n-aria')));
  fillSelect('fmt',FMTS,DEF_META.fmt); fillSelect('pos',POSS,DEF_META.pos); fillSelect('opp',OPPS,DEF_META.opp);
  buildForm(); buildNorms(); langButtons(); renderAll();
}

function mkGame(c,md,mins,pos){
  var g={}; ALL_KEYS.forEach(function(k){ g[k]=c[k]||0; });
  g.rec=keysFor(md).slice(); g.mins=mins; g.fmt='f4'; g.pos=pos||'pos_cen'; g.opp='opp_eq'; g.mode=md; g.version=1;
  return g;
}
function sample(){
  var a={id:uid(),name:t('sample_player',{n:'07'}),birth:'2018-03-14',externalId:null,groupId:null,games:[
    mkGame({look:9,touch:8,dribA:6,dribOk:3,open:11,passAll:18,passOk:13,passFwd:4,weak:3,press:6,longA:5,longOk:2,retry:3},'video',16),
    mkGame({look:11,touch:9,dribA:8,dribOk:5,open:12,passAll:20,passOk:15,passFwd:5,weak:4,press:5,longA:5,longOk:3,retry:4},'video',16),
    mkGame({look:10,touch:10,dribA:7,dribOk:4,open:10,passAll:17,passOk:12,passFwd:4,weak:2,press:7,longA:5,longOk:3,retry:3},'video',16)]};
  var b={id:uid(),name:t('sample_player',{n:'12'}),birth:'2017-11-02',externalId:null,groupId:null,games:[
    mkGame({dribA:6,dribOk:3,passAll:16,passOk:12,passFwd:3,press:5,longA:5,longOk:2},'live',8,'pos_wing'),
    mkGame({dribA:7,dribOk:4,passAll:18,passOk:14,passFwd:5,press:6,longA:5,longOk:3},'live',8,'pos_wing')]};
  var c={id:uid(),name:t('sample_player',{n:'03'}),birth:'2018-07-21',externalId:null,groupId:null,games:[
    mkGame({look:6,touch:7,dribA:4,dribOk:1,open:7,passAll:12,passOk:8,passFwd:2,weak:1,press:3,longA:4,longOk:1,retry:2},'video',16,'pos_def')]};
  players=players.concat([a,b,c]); activeId=a.id; persist(); renderAll(); track('sample_loaded');
}

lang=detectLang(); load(); applyLang();

$('langs').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b||!b.dataset.lang) return;
  lang=b.dataset.lang; try{ localStorage.setItem(LSTORE,lang); }catch(err){}
  hideErr('err'); hideErr('perr'); applyLang(); track('lang_'+lang);
});
$('players').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b||!b.dataset.pid) return;
  activeId=b.dataset.pid; persist(); hideErr('err'); renderAll();
});
$('addp').addEventListener('click', function(){
  var name=$('pname').value.trim(), birth=$('pbirth').value;
  if(!name){ showErr('perr',t('e_name')); return; }
  if(!birth || ageMonthsOf(birth)===null){ showErr('perr',t('e_birth')); return; }
  hideErr('perr');
  var p={id:uid(),name:name,birth:birth,externalId:null,groupId:null,games:[]};
  players.push(p); activeId=p.id; $('pname').value=''; $('pbirth').value='';
  persist(); renderAll(); track('player_added');
});
var delArmed=false;
$('delp').addEventListener('click', function(){
  var b=$('delp'), p=active(); if(!p) return;
  if(!delArmed){ delArmed=true; b.textContent=t('del_confirm',{n:p.name}); setTimeout(function(){ delArmed=false; b.textContent=t('del_player'); },4000); return; }
  delArmed=false; b.textContent=t('del_player');
  players=players.filter(function(x){ return x.id!==p.id; }); delete draft[p.id];
  activeId=players.length?players[0].id:null; persist(); renderAll();
});
$('m-live').addEventListener('click', function(){ mode='live'; persist(); hideErr('err'); applyMode(); });
$('m-video').addEventListener('click', function(){ mode='video'; persist(); hideErr('err'); applyMode(); track('mode_video'); });

$('items').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b||!b.dataset.k) return;
  var p=active(); if(!p){ showErr('err',t('e_need')); return; }
  var d=getDraft(p.id), k=b.dataset.k;
  d.c[k]=Math.max(0,d.c[k]+parseInt(b.dataset.d,10));
  $('n_'+k).textContent=d.c[k]; hideErr('err');
});
$('mins').addEventListener('input', function(){ var p=active(); if(p) getDraft(p.id).mins=parseInt($('mins').value,10)||0; });
['fmt','pos','opp'].forEach(function(id){ $(id).addEventListener('change', function(){ var p=active(); if(p) getDraft(p.id)[id]=$(id).value; }); });

$('save').addEventListener('click', function(){
  var p=active(); if(!p){ showErr('err',t('e_need')); return; }
  var m=validate(p); if(m){ showErr('err',p.name+': '+m); return; }
  hideErr('err'); saveGame(p); persist(); renderAll();
});
$('saveall').addEventListener('click', function(){
  if(!players.length){ showErr('err',t('e_need')); return; }
  var errs=[], saved=0;
  players.forEach(function(p){
    if(draftTotal(p)===0) return;
    var m=validate(p); if(m){ errs.push(p.name+': '+m); return; }
    saveGame(p); saved++;
  });
  if(!saved && !errs.length){ showErr('err',t('e_emptyall')); return; }
  if(errs.length) showErr('err',(saved?t('saved_n',{n:saved}):'')+t('not_saved')+errs.join(' ')); else hideErr('err');
  persist(); renderAll();
});
$('clearform').addEventListener('click', function(){
  var p=active(); if(!p) return;
  var d=getDraft(p.id); ALL_KEYS.forEach(function(k){ d.c[k]=0; }); paintDraft(); hideErr('err');
});
$('sample').addEventListener('click', sample);
var wipeArmed=false;
$('wipe').addEventListener('click', function(){
  var b=$('wipe');
  if(!wipeArmed){ wipeArmed=true; b.textContent=t('wipe_confirm'); setTimeout(function(){ wipeArmed=false; b.textContent=t('wipe_btn'); },4000); return; }
  wipeArmed=false; b.textContent=t('wipe_btn');
  players=[]; activeId=null; draft={};
  try{ localStorage.removeItem(STORE); localStorage.removeItem(OLD); }catch(e){}
  renderAll();
});
$('result').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b||b.dataset.rm===undefined) return;
  var p=active(); if(!p) return;
  p.games.splice(parseInt(b.dataset.rm,10),1); persist(); renderAll();
});
$('normreset').addEventListener('click', function(){ norms=JSON.parse(JSON.stringify(NORMS_DEF)); buildNorms(); persist(); render(); });
</script>
